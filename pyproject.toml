[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altostrat-hr-agent"
version = "1.0.0"
description = "Altostrat Singapore — HR Agentic Assistant (MVP 1) on Google ADK 2+"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pandas>=2.2.3",
    "tabulate>=0.9.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
]
eval = [
    "google-adk[eval]>=1.0.0",
    "pandas>=2.2.3",
    "tabulate>=0.9.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
